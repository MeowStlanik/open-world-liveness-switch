name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: python -m venv .venv
      - run: uv pip install --python .venv/bin/python -r requirements-dev.txt
      - run: .venv/bin/genvm-lint check contracts/open_world_liveness_switch.py
      - run: PATH="$PWD/.venv/bin:$PATH" .venv/bin/genvm-lint typecheck contracts/open_world_liveness_switch.py
      - run: .venv/bin/pytest tests/direct -v
